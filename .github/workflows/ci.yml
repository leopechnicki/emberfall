# EMBERFALL - CI.
#
# This exists because test/framing.mjs claims a framing regression "can never
# silently happen", and until this branch nothing ran it on a push, so that
# claim held only as long as somebody remembered. A gate nobody runs is the
# same failure this branch was written to fix, one level up.
#
# TWO JOBS, ON PURPOSE.
#
# `gates` is deterministic: the framing measurement and the touch suite. It
# blocks. These read rendered pixels and layout constants and give the same
# answer on any machine.
#
# `full-day` plays a whole day of the game in real time, including the grove
# traversal, and it is NOT a gate yet - `continue-on-error` - because it is
# flaky on shared runners for a reason that is about the test, not the game.
# driveSwing() in test/verify.mjs polls the pendulum's angle over CDP and
# releases the vine when it notices the release window. Locally a round trip
# is about a millisecond against a swing period near a second and the release
# lands on the mark; on a loaded runner the round trip is tens of
# milliseconds, every release comes late and low, the keeper never builds
# height and the crossing stalls near 45% however long the budget is. The
# identical commit crossed 100% on a quieter runner, which is the tell.
#
# The obvious fix - detect the release angle inside the page with
# waitForFunction so detection is frame-accurate - was tried and is WORSE:
# it releases at exactly RELEASE_DEG every time, and that constant is tuned
# around the old sampling cadence, so the keeper releases too early and
# crossed 22.9% with 1258 vines hooked. Fixing this properly means deriving
# the release control law rather than inheriting it, and that is a change to
# the one test proving the grove is completable. It is not something to rush
# alongside a framing fix.
#
# So it reports instead of gating. It still runs on every push, its output is
# still read, and it stays green locally where it is reliable (46/46 on real
# Chrome). When the driver is fixed, delete continue-on-error.
name: CI

on:
  push:
    branches: [main, 'crew/**']
  pull_request:
    branches: [main]

jobs:
  gates:
    name: framing + touch (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Real Google Chrome, not Chromium: the suites ask for channel 'chrome'
      # and fall back loudly if it is missing.
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: framing gate
        run: npm run test:framing
      - name: touch suite
        run: npm run test:mobile
      # The overlays are the evidence a human can check: the detected horizon
      # drawn on the frame it was measured from.
      - name: Upload framing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framing-screenshots
          path: test/screenshots/framing/
          if-no-files-found: ignore
          retention-days: 14

  full-day:
    name: full day incl. grove traversal (reported, not gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: verify
        run: npm run test:verify
